# Letakkan file ini pada path: .github/workflows/snake.yml
name: Update Space Shooter Game

on:
  # Jalankan otomatis setiap hari pukul 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    name: Generate space shooter animation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Wajib agar commit sebelumnya bisa di-amend

      - name: Generate game GIF
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: LrRyPa
          output-path: "game.gif"
          strategy: "random" # pilihan: column | row | random
          fps: 40
