# Letakkan file ini pada path: .github/workflows/snake.yml
name: Generate Pixel Snake

on:
  # Jalankan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalankan setiap ada push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Palet retro ala PICO-8:
      #   snake : #FF004D (merah pixel)
      #   dots  : #1D2B53 (kosong) -> #008751 -> #00E436 -> #FFEC27 -> #FFA300
      - name: Generate snake SVG (pixel art palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pixel-snake.svg?color_snake=#FF004D&color_dots=#FFF1E8,#C2C3C7,#00E436,#008751,#1D2B53&size_dot=12&size_cell=16&sizeDotBorderRadius=0
            dist/pixel-snake-dark.svg?palette=github-dark&color_snake=#FFEC27&color_dots=#1D2B53,#7E2553,#008751,#00E436,#FFEC27&size_dot=12&size_cell=16&sizeDotBorderRadius=0

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
````
