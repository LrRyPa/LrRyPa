name: Update Space Shooter Game

on:
  # Jalankan otomatis setiap hari pukul 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Otomatis jalan saat ada push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-game:
    name: Generate space shooter animation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Space Shooter GIF
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: LrRyPa
          output-path: "dist/game.gif"
          strategy: "random"
          fps: 40

      - name: Push generated game GIF to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
